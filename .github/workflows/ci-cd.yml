name: CI/CD

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: vehicle-marketplace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/vehicle-marketplace

jobs:
  test:
    name: Testes e compilacao
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Executar testes
        run: ./mvnw -B test
      - name: Compilar e empacotar
        run: ./mvnw -B -DskipTests package

  publish:
    name: Publicar imagem no Docker Hub
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Definir tags da imagem
        id: image
        run: echo "name=${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}

  deploy:
    name: Deploy na VPS Oracle
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Copiar compose para a VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: docker-compose.yml
          target: ${{ secrets.VPS_DEPLOY_PATH }}
      - name: Atualizar containers
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE: ${{ needs.publish.outputs.image }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          envs: APP_IMAGE
          script: |
            cd "${{ secrets.VPS_DEPLOY_PATH }}"
            printf 'APP_IMAGE=%s\n' "$APP_IMAGE" > .image.env
            docker compose --env-file .env --env-file .image.env pull app
            docker compose --env-file .env --env-file .image.env up -d --no-build --remove-orphans
