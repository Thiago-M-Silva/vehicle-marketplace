name: CI/CD

on:
  pull_request:
    branches:
      - master
      - develop

  push:
    branches:
      - master
      - develop

concurrency:
  group: vehicle-marketplace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/vehicle-marketplace

jobs:

  # ========================================
  # CI
  # ========================================
  test:
    name: Testes e compilação
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tornar mvnw executável
        run: chmod +x ./mvnw

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Executar testes
        run: ./mvnw -B test

      - name: Compilar e empacotar
        run: ./mvnw -B -DskipTests package


  # ========================================
  # Docker Hub
  # ========================================
  publish:
    name: Publicar imagem no Docker Hub
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}


  # ========================================
  # Deploy
  # ========================================
  deploy:
    name: Deploy na VPS Oracle

    needs: publish

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    runs-on: ubuntu-latest

    environment: production

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Copiar compose para a VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: docker-compose.yml
          target: ${{ secrets.VPS_DEPLOY_PATH }}

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          envs: APP_IMAGE

          script: |
            set -e

            echo "APP_IMAGE recebido: [$APP_IMAGE]"

            if [ -z "$APP_IMAGE" ]; then
              echo "ERRO: APP_IMAGE está vazio!"
              exit 1
            fi

            cd "${{ secrets.VPS_DEPLOY_PATH }}"

            export APP_IMAGE="$APP_IMAGE"

            docker compose pull app
            docker compose up -d --no-build --remove-orphans
